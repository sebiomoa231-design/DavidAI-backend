[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "davidai-backend"
version = "0.0.0"
description = "David AI backend - Render-ready packaging metadata"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "sebiomoa231-design", email = "sebiomoa231@gmail.com" }
]
# Pin project dependencies to match requirements.txt so builds are reproducible.
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.1",
  "pydantic==2.7.4",
  "pydantic-settings==2.3.4",
  "python-dotenv==1.0.1",
  "httpx==0.24.1",
  "pyjwt==2.8.0",
  "python-multipart==0.0.9",
  "beautifulsoup4==4.12.3",
  "readability-lxml==0.8.1",
  "sqlalchemy==2.0.31",
  "aiofiles==23.2.1",
]
